name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC: refresh CBS and ECB/DNB data, rebuild
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest open data (keeps committed data on failure)
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-data.mjs && node scripts/fetch-rates.mjs
      - name: Restore committed data after a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: git checkout -- data/
      - name: Test
        run: node --test
      - name: Build
        run: node build.mjs
      - name: Commit refreshed data back (only when figures changed, not just fetchedAt)
        if: github.event_name != 'push' && steps.fetch.outcome == 'success'
        run: |
          changed=$(node -e "
            const fs=require('fs'),cp=require('child_process');
            const strip=t=>JSON.stringify(JSON.parse(t),(k,v)=>k==='fetchedAt'?undefined:v);
            let c=[];for(const f of fs.readdirSync('data').filter(f=>f.endsWith('.json'))){
              let old='';try{old=cp.execSync('git show HEAD:data/'+f).toString()}catch{}
              if(!old||strip(old)!==strip(fs.readFileSync('data/'+f,'utf8')))c.push('data/'+f)}
            console.log(c.join(' '))")
          if [ -n "$changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $changed
            git commit -m "data: refresh from CBS / ECB-DNB ($(date -u +%F)) [skip ci]"
            git push
          else
            echo "No figure changes; nothing to commit."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow.mjs
